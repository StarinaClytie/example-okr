project_id = "example-okr"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
enabled = true
port = 54322
major_version = 17

[db.seed]
# Organization and administrator setup is explicit; no seed.sql is shipped.
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/auth/reset-password", "http://127.0.0.1:5173/auth/reset-password"]
jwt_expiry = 3600
# Northstar OKR uses public self-registration followed by administrator approval.
# Self-registered accounts start `approval_status = 'pending'` with no role and
# gain access only after an administrator approves them.
#
# Email/password registration requires confirmation in this local stack.
# Local mail is captured by local_smtp, never sent to real recipients.
# Hosted Auth SMTP and templates must be configured in the provider dashboard.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.admin-delete-user]
verify_jwt = true

[functions.resource-problem-notify]
verify_jwt = true
